name: Deploy

on:
  push:
    branches:
      - master

env:
  SERVER_HOST: 81.200.158.36
  SERVER_USER: museum
  SERVER_PATH: /home/museum/DjangoServer

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2.3.1
        with:
          key: "${{ secrets.SSH_KEY_TIMEWEB }}"
          known_hosts: ${{ env.SERVER_HOST }}

      - name: Generate known hosts
        run: ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Copy files to server
        run: rsync -rvz --progress --chown=museum:docker . ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.SERVER_PATH }} --rsync-path="sudo rsync" -v

      - name: Check permissions
        run: ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "ls -l ${SERVER_PATH}"

      - name: Deploy with Docker Compose
        run: |
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "cd ${{ env.SERVER_PATH }} && docker-compose down && docker-compose up -d --build"
